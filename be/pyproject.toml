[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-api"
version = "0.1.0"
description = "Local HTTP API for Fashion Intelligence models"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fashion-intelligence==0.1.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src"]
addopts = "--import-mode=importlib"
