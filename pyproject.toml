[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-intelligence"
version = "0.1.0"
description = "COSC2753 Assignment 2 fashion classification and visual search"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jupyter==1.1.1",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "threadpoolctl==3.6.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agents", ".claude"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"notebooks/01_data_preparation.ipynb" = ["E501"]
"notebooks/task-4/01_v1_eda.ipynb" = ["F401"]
"scripts/task4/run_model_comparisons.py" = ["E402"]
