[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-intelligence"
version = "0.1.0"
description = "COSC2753 Assignment 2 fashion classification and visual search"
requires-python = ">=3.11"
dependencies = [
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agents", ".claude"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
