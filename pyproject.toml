# Workspace test configuration. Install the Python packages from core/ and be/.
[tool.pytest.ini_options]
testpaths = ["core/tests", "be/tests"]
pythonpath = ["core", "core/src", "be/src", "core/tests/data", "core/tests/train", "core/tests/task1"]
addopts = "--import-mode=importlib"
tmp_path_retention_policy = "all"

[tool.ruff]
extend-exclude = [".agents", ".claude"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"core/notebooks/01_data_preparation.ipynb" = ["E501"]
"core/notebooks/task-4/08_task4_part1_image_eda.ipynb" = ["F401"]
"core/scripts/task4/run_model_comparisons.py" = ["E402"]
